<!doctype html>
<meta charset="utf-8">
<!-- Two laurel wreaths with small capitals inside, on a transparent 1280 x 720 page. Change the words, then run render_overlays.py. -->
<style>
  html, body { margin: 0; width: 1280px; height: 720px; background: transparent; overflow: hidden; }
  .laurel { position: absolute; width: 240px; height: 120px; color: #fff; text-align: center;
    text-shadow: 0 1px 6px rgba(0,0,0,.5); }
  #left { top: 285px; left: 130px; }
  #right { top: 285px; right: 130px; }
  .laurel svg { position: absolute; top: 0; left: 50%; transform: translateX(-50%); }
  .laurel .txt { position: absolute; top: 26px; left: 0; width: 100%; }
  .small { font: 400 10px/1.5 Didot, "Bodoni Moda", serif; letter-spacing: .4em; text-transform: uppercase; }
  .big { font: 400 16px/1.3 Didot, "Bodoni Moda", serif; letter-spacing: .2em; text-transform: uppercase; margin-top: 6px; }
  .yr { font: 400 10px/1.5 Didot, "Bodoni Moda", serif; letter-spacing: .35em; margin-top: 6px; }
</style>
<div class="laurel" id="left">
  <svg width="240" height="120" viewBox="0 0 240 120" fill="#fff" class="w"></svg>
  <div class="txt">
    <div class="small">Winner</div>
    <div class="big">Your<br>Award</div>
    <div class="yr">2026</div>
  </div>
</div>
<div class="laurel" id="right">
  <svg width="240" height="120" viewBox="0 0 240 120" fill="#fff" class="w"></svg>
  <div class="txt">
    <div class="small">Official Selection</div>
    <div class="big">Your<br>Festival</div>
    <div class="yr">2026</div>
  </div>
</div>
<script>
// each wreath is two arcs of leaves, drawn as rotated ellipses
function branch(cx, cy, r, a0, a1, n, flip) {
  let s = '';
  for (let i = 0; i < n; i++) {
    const t = a0 + (a1 - a0) * i / (n - 1);
    const x = cx + r * Math.cos(t), y = cy + r * Math.sin(t);
    const deg = t * 180 / Math.PI + (flip ? -35 : 35) + 90;
    const len = 11 - i * 0.3, wid = 3.4 - i * 0.08;
    s += `<ellipse cx="${x}" cy="${y}" rx="${wid}" ry="${len}" transform="rotate(${deg} ${x} ${y})"/>`;
  }
  return s;
}
for (const el of document.querySelectorAll('svg.w')) {
  el.innerHTML =
    branch(120, 14, 96, Math.PI * 0.52, Math.PI * 1.02, 12, false) +
    branch(120, 14, 96, Math.PI * 0.48, Math.PI * -0.02, 12, true);
}
</script>
